<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forms.css">
    <title>Document</title>
</head>
<body>
    <div class="formulario">
    <form id="formJogo">
        <input type="text" id="nome" placeholder="Nome do jogo" required><br>
        <input type="text" id="imagem" placeholder="URL da imagem" required><br>
        <input type="text" id="trailer" placeholder="Link do YouTube embed" required><br>

        <textarea id="sinopse" placeholder="Sinopse"></textarea>
        <input type="text" id="data" placeholder="Data de lançamento">
        <input type="text" id="dev" placeholder="Desenvolvedora">
        <textarea id="minimo" placeholder="Requisitos mínimos (um por linha)"></textarea>
        <textarea id="recomendado" placeholder="Requisitos recomendados (um por linha)"></textarea>
        <button type="submit">Adicionar Jogo</button>
    </div>
</form>
</form>
</body>
